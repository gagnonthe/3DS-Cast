name: 3DS Cast Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake g++ ca-certificates curl jq bzip2

      - name: Install official CTRPluginFramework 0.8.0 binary
        shell: bash
        run: |
          set -euxo pipefail

          API="https://gitlab.com/api/v4/projects/thepixellizeross%2Fctrpluginframework/releases/0.8.0"

          curl -fL "$API" -o /tmp/ctrpf-release.json

          echo "=== Release assets ==="
          jq -r '.assets.links[]? | "\(.name) -> \(.direct_asset_url // .url)"' /tmp/ctrpf-release.json

          URL="$(
            jq -r '
              .assets.links[]?
              | select(.name == "libctrpf-0.8.0.tar.bz2")
              | (.direct_asset_url // .url)
            ' /tmp/ctrpf-release.json \
            | head -n1
          )"

          test -n "$URL"
          test "$URL" != "null"

          curl -fL "$URL" -o /tmp/libctrpf-0.8.0.tar.bz2

          rm -rf /tmp/libctrpf-unpack /opt/devkitpro/libctrpf
          mkdir -p /tmp/libctrpf-unpack
          tar -xjf /tmp/libctrpf-0.8.0.tar.bz2 -C /tmp/libctrpf-unpack

          echo "=== Archive tree ==="
          find /tmp/libctrpf-unpack -maxdepth 3 -type d -print
          find /tmp/libctrpf-unpack -maxdepth 3 -type f -print | head -80

          ROOT="$(
            find /tmp/libctrpf-unpack -type d -name include -printf '%h\n' \
            | while read -r d; do
                if [ -d "$d/lib" ]; then
                  echo "$d"
                  break
                fi
              done
          )"

          test -n "$ROOT"
          test -d "$ROOT/include"
          test -d "$ROOT/lib"

          mkdir -p /opt/devkitpro/libctrpf
          cp -a "$ROOT/include" "$ROOT/lib" /opt/devkitpro/libctrpf/

          echo "=== Installed libctrpf ==="
          find /opt/devkitpro/libctrpf -maxdepth 3 -type f -print | head -80

          test -d /opt/devkitpro/libctrpf/include
          test -d /opt/devkitpro/libctrpf/lib

      - name: Build 3gxtool 1.3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/3gxtool
          git clone --recursive --depth 1 --branch v1.3 \
            https://gitlab.com/thepixellizeross/3gxtool.git \
            /tmp/3gxtool

          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build
          cmake --build /tmp/3gxtool/build -j2

          test -x /tmp/3gxtool/build/3gxtool
          install -m 0755 /tmp/3gxtool/build/3gxtool /usr/local/bin/3gxtool

          command -v 3gxtool
          3gxtool --help >/dev/null

      - name: Fetch CTRPF blank template
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 \
            https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git \
            /tmp/3dscast

          rm -rf /tmp/3dscast/.git /tmp/3dscast/.github

          cat > /tmp/3dscast/CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 1
              Revision: 9

          Targets:

          Title: 3DS Cast

          Summary: Nintendo 3DS local screen streaming experiment

          Description: |
            Baseline 3GX build for 3DS Cast.
            This version validates the plugin toolchain before streaming is added.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp/3dscast

          make clean || true
          make -j1

          echo "=== Build outputs ==="
          find . -maxdepth 2 -type f \( -name '*.o' -o -name '*.elf' -o -name '*.3gx' \) -print

          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/3DS-Cast.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"

          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.1.9
          path: release/
          if-no-files-found: error
          retention-days: 30
