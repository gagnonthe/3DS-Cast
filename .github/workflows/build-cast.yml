name: 3DS Cast Patched CTRPF Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake g++ ca-certificates

      - name: Build CTRPluginFramework 0.8.0 with GCC compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/ctrpf-src /tmp/ctrpf-dist
          git clone --recursive --depth 1 --branch 0.8.0 \
            https://gitlab.com/thepixellizeross/ctrpluginframework.git \
            /tmp/ctrpf-src

          cd /tmp/ctrpf-src/Library

          echo "=== Before patch: Werror occurrences ==="
          grep -RIn -- '-Werror' . || true

          # Current devkitARM/GCC reports a few unused-but-set-variable warnings
          # in CTRPF 0.8.0. The project enables -Werror, so those warnings abort
          # the build. Keep all warnings, but do not promote this one class to
          # an error.
          MAKEFILE_CANDIDATES="$(find . -maxdepth 2 -type f \( -name 'Makefile' -o -name '*.mk' \) -print)"
          PATCHED=0

          for f in $MAKEFILE_CANDIDATES; do
            if grep -q -- '-Werror' "$f"; then
              sed -i 's/-Werror/-Werror -Wno-error=unused-but-set-variable/g' "$f"
              PATCHED=1
            fi
          done

          if [ "$PATCHED" -eq 0 ]; then
            echo "Could not find -Werror in CTRPF build files."
            exit 1
          fi

          echo "=== After patch ==="
          grep -RIn -- '-Werror' . || true

          make clean || true
          make -j1
          make dist-bin

          ARCHIVE="$(find . -maxdepth 2 -type f \( -name '*.tar.bz2' -o -name '*.tar.gz' -o -name '*.tar' \) -print -quit)"
          test -n "$ARCHIVE"

          mkdir -p /tmp/ctrpf-dist
          tar -xf "$ARCHIVE" -C /tmp/ctrpf-dist

          ROOT="$(
            find /tmp/ctrpf-dist -type d -name include -printf '%h\n' \
            | while read -r d; do
                if [ -d "$d/lib" ]; then
                  echo "$d"
                  break
                fi
              done
          )"

          test -n "$ROOT"
          test -d "$ROOT/include"
          test -d "$ROOT/lib"

          rm -rf /opt/devkitpro/libctrpf
          mkdir -p /opt/devkitpro/libctrpf
          cp -a "$ROOT/include" "$ROOT/lib" /opt/devkitpro/libctrpf/

          test -d /opt/devkitpro/libctrpf/include
          test -d /opt/devkitpro/libctrpf/lib

      - name: Build 3gxtool 1.3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/3gxtool
          git clone --recursive --depth 1 --branch v1.3 \
            https://gitlab.com/thepixellizeross/3gxtool.git \
            /tmp/3gxtool

          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build
          cmake --build /tmp/3gxtool/build -j2

          test -x /tmp/3gxtool/build/3gxtool
          install -m 0755 /tmp/3gxtool/build/3gxtool /usr/local/bin/3gxtool

          command -v 3gxtool
          3gxtool --help >/dev/null

      - name: Fetch CTRPF blank template
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 \
            https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git \
            /tmp/3dscast

          rm -rf /tmp/3dscast/.git /tmp/3dscast/.github

          cat > /tmp/3dscast/CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 1
              Revision: 10

          Targets:

          Title: 3DS Cast

          Summary: Nintendo 3DS local screen streaming experiment

          Description: |
            Baseline 3GX build for 3DS Cast.
            This build uses CTRPluginFramework 0.8.0 with a GCC compatibility patch.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail

          cd /tmp/3dscast
          make clean || true
          make -j1

          echo "=== Build outputs ==="
          find . -maxdepth 2 -type f \( -name '*.o' -o -name '*.elf' -o -name '*.3gx' \) -print

          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/3DS-Cast.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"

          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.1.10
          path: release/
          if-no-files-found: error
          retention-days: 30
