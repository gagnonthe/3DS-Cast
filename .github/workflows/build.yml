name: Build 3DS Cast Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CTRPluginFramework
        shell: bash
        run: |
          set -euxo pipefail

          CONF="/opt/devkitpro/pacman/etc/pacman.conf"

          if ! grep -Fq "[thepixellizeross-lib]" "$CONF"; then
            cat >> "$CONF" <<'EOF'

          [thepixellizeross-lib]
          Server = https://thepixellizeross.gitlab.io/packages/any
          SigLevel = Optional
          EOF
          fi

          if ! grep -Fq "[thepixellizeross-linux]" "$CONF"; then
            cat >> "$CONF" <<'EOF'

          [thepixellizeross-linux]
          Server = https://thepixellizeross.gitlab.io/packages/x86_64/linux
          SigLevel = Optional
          EOF
          fi

          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed libctrpf git

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          test -d /opt/devkitpro/libctrpf
          command -v 3gxtool

      - name: Fetch clean CTRPF template
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 \
            https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git \
            /tmp/3dscast

          rm -rf /tmp/3dscast/.git /tmp/3dscast/.github

          cat > /tmp/3dscast/CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 1
              Revision: 3

          Targets:

          Title: 3DS Cast

          Summary: Nintendo 3DS local screen streaming experiment

          Description: |
            3DS Cast v0.1.3.
            This first artifact validates loading as a Luma3DS 3GX plugin.
            Streaming code will be added after the clean plugin build is validated.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF

          echo "=== Sources ==="
          find /tmp/3dscast/Sources -maxdepth 1 -type f -print

      - name: Build clean plugin
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          set -euxo pipefail

          cd /tmp/3dscast

          make clean || true

          # Build sequentially to avoid the missing-object race seen with make -j2.
          make -j1

          echo "=== Build directory ==="
          find Build -maxdepth 1 -type f -print || true

          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/3DS-Cast.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"

          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload 3DS Cast plugin
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.1.3
          path: release/
          if-no-files-found: error
          retention-days: 30
