name: Build 3DS Cast Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CTRPluginFramework
        shell: bash
        run: |
          set -euxo pipefail

          SRC_CONF="/opt/devkitpro/pacman/etc/pacman.conf"
          TMP_CONF="/tmp/pacman-ctrpf.conf"

          # Keep pacman options, but completely remove the two official remote
          # devkitPro repositories that are currently answering HTTP 403.
          awk '
            BEGIN { skip=0 }
            /^\[dkp-libs\]$/  { skip=1; next }
            /^\[dkp-linux\]$/ { skip=1; next }
            /^\[/ {
              if (skip==1) skip=0
            }
            skip==0 { print }
          ' "$SRC_CONF" > "$TMP_CONF"

          cat >> "$TMP_CONF" <<'EOF'

          [thepixellizeross-lib]
          Server = https://thepixellizeross.gitlab.io/packages/any
          SigLevel = Optional

          [thepixellizeross-linux]
          Server = https://thepixellizeross.gitlab.io/packages/x86_64/linux
          SigLevel = Optional
          EOF

          echo "=== Active repositories ==="
          grep -E '^\[[^]]+\]$|^Server' "$TMP_CONF"

          # Synchronize only the CTRPF repositories.
          dkp-pacman --config "$TMP_CONF" -Sy --noconfirm
          dkp-pacman --config "$TMP_CONF" -S --noconfirm --needed libctrpf

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          test -d /opt/devkitpro/libctrpf
          command -v 3gxtool

      - name: Fetch clean CTRPF template
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 \
            https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git \
            /tmp/3dscast

          rm -rf /tmp/3dscast/.git /tmp/3dscast/.github

          cat > /tmp/3dscast/CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 1
              Revision: 4

          Targets:

          Title: 3DS Cast

          Summary: Nintendo 3DS local screen streaming experiment

          Description: |
            3DS Cast v0.1.4.
            This build validates the clean Luma3DS 3GX plugin toolchain.
            Screen streaming will be added after this baseline loads correctly.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF

          echo "=== Template sources ==="
          find /tmp/3dscast/Sources -maxdepth 1 -type f -print

      - name: Build clean plugin
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          set -euxo pipefail
          cd /tmp/3dscast

          make clean || true
          make -j1

          echo "=== Build outputs ==="
          find . -maxdepth 2 -type f \( -name '*.o' -o -name '*.elf' -o -name '*.3gx' \) -print

          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/3DS-Cast.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"

          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload 3DS Cast plugin
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.1.4
          path: release/
          if-no-files-found: error
          retention-days: 30
