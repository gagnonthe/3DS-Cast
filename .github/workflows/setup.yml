name: Setup and Build 3DS Cast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CTRPluginFramework
        shell: bash
        run: |
          set -euxo pipefail
          CONF="/opt/devkitpro/pacman/etc/pacman.conf"
          if ! grep -Fq "[thepixellizeross-lib]" "$CONF"; then
            printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' >> "$CONF"
          fi
          if ! grep -Fq "[thepixellizeross-linux]" "$CONF"; then
            printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' >> "$CONF"
          fi
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed libctrpf git
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"

      - name: Create clean project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ctrpf-template /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git /tmp/ctrpf-template
          mkdir /tmp/3dscast
          (cd /tmp/ctrpf-template && tar --exclude=.git --exclude=.github -cf - .) | (cd /tmp/3dscast && tar -xf -)

          cd /tmp/3dscast
          cat > CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 1
              Revision: 1

          Targets:

          Title: 3DS Cast

          Summary: Nintendo 3DS local screen streaming experiment

          Description: |
            Initial 3DS Cast plugin build.
            This build validates CTRPluginFramework loading before streaming is enabled.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/3dscast

          # Critical: do NOT override TARGET in the template Makefile.
          # Its build system expects OUTPUT to match the working directory name.
          make clean || true
          make -j1

          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/3DS-Cast.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"

          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.1.1
          path: release/
          if-no-files-found: error
          retention-days: 30
