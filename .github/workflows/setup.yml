name: Setup and Build 3DS Cast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CTRPluginFramework
        shell: bash
        run: |
          set -euxo pipefail

          CONF="/opt/devkitpro/pacman/etc/pacman.conf"

          if ! grep -Fq "[thepixellizeross-lib]" "$CONF"; then
            cat >> "$CONF" <<'EOF'

          [thepixellizeross-lib]
          Server = https://thepixellizeross.gitlab.io/packages/any
          SigLevel = Optional
          EOF
          fi

          if ! grep -Fq "[thepixellizeross-linux]" "$CONF"; then
            cat >> "$CONF" <<'EOF'

          [thepixellizeross-linux]
          Server = https://thepixellizeross.gitlab.io/packages/x86_64/linux
          SigLevel = Optional
          EOF
          fi

          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed libctrpf

          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"

      - name: Bootstrap 3DS Cast project
        shell: bash
        run: |
          set -euxo pipefail

          # Only bootstrap the source tree once.
          if [ ! -f "Makefile" ]; then
            git clone --depth 1 --branch v0.8.0 \
              https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git \
              /tmp/ctrpf-template

            # Copy the template without its Git metadata/workflows.
            (
              cd /tmp/ctrpf-template
              tar --exclude=.git --exclude=.github -cf - .
            ) | tar -xf -

            cat > CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 1
              Revision: 0

          Targets:

          Title: 3DS Cast

          Summary: Stream Nintendo 3DS screens to a local web browser

          Description: |
            3DS Cast is an experimental Luma3DS 3GX plugin.
            V0.1 establishes a clean CTRPluginFramework build base.
            Screen capture and the local web streaming server will be added next.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF
          fi

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail
          make clean || true
          make -j2

          echo "Generated files:"
          find . -maxdepth 2 -type f \( -name "*.3gx" -o -name "*.elf" \) -print

          test -n "$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"

      - name: Save generated project files
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Makefile 3gx.ld CTRPluginFramework.plgInfo Includes Sources .gitignore 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap 3DS Cast CTRPF project"
            git push
          else
            echo "Project already bootstrapped; nothing to commit."
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          find . -maxdepth 2 -type f -name "*.3gx" -exec cp {} release/3DS-Cast.3gx \;
          cp CTRPluginFramework.plgInfo release/
          test -f release/3DS-Cast.3gx

      - name: Upload 3DS Cast artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.1
          path: release/
          if-no-files-found: error
