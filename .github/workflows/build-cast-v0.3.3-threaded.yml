name: 3DS Cast v0.3.4 Network Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git cmake g++ ca-certificates

      - name: Build CTRPluginFramework 0.8.0
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ctrpf-src /tmp/ctrpf-dist
          git clone --recursive --depth 1 --branch 0.8.0 https://gitlab.com/thepixellizeross/ctrpluginframework.git /tmp/ctrpf-src
          cd /tmp/ctrpf-src/Library
          PATCHED=0
          for f in $(find . -maxdepth 2 -type f \( -name 'Makefile' -o -name '*.mk' \) -print); do
            if grep -q -- '-Werror' "$f"; then
              sed -i 's/-Werror/-Werror -Wno-error=unused-but-set-variable/g' "$f"
              PATCHED=1
            fi
          done
          test "$PATCHED" -eq 1
          make clean || true
          make -j1
          make dist-bin
          ARCHIVE="$(find . -maxdepth 2 -type f \( -name '*.tar.bz2' -o -name '*.tar.gz' -o -name '*.tar' \) -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p /tmp/ctrpf-dist
          tar -xf "$ARCHIVE" -C /tmp/ctrpf-dist
          ROOT="$(find /tmp/ctrpf-dist -type d -name include -printf '%h\n' | while read -r d; do if [ -d "$d/lib" ]; then echo "$d"; break; fi; done)"
          test -n "$ROOT"
          rm -rf /opt/devkitpro/libctrpf
          mkdir -p /opt/devkitpro/libctrpf
          cp -a "$ROOT/include" "$ROOT/lib" /opt/devkitpro/libctrpf/

      - name: Build 3gxtool 1.3
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/3gxtool
          git clone --recursive --depth 1 --branch v1.3 https://gitlab.com/thepixellizeross/3gxtool.git /tmp/3gxtool
          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build
          cmake --build /tmp/3gxtool/build -j2
          test -x /tmp/3gxtool/build/3gxtool
          install -m 0755 /tmp/3gxtool/build/3gxtool /usr/local/bin/3gxtool

      - name: Prepare 3DS Cast v0.3.4
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git /tmp/3dscast
          rm -rf /tmp/3dscast/.git /tmp/3dscast/.github

          cat > /tmp/3dscast/CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 3
              Revision: 4

          Targets:

          Title: 3DS Cast Network Diagnostic

          Summary: Background HTTP server with SD diagnostics

          Description: |
            Keeps the normal CTRPF lifecycle running while a separate worker
            thread tests the HTTP server on port 8080.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: false
          EOF

          cat > /tmp/3dscast/Sources/main.cpp <<'EOF'
          #include <3ds.h>
          #include <CTRPluginFramework.hpp>
          #include <arpa/inet.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <malloc.h>
          #include <netinet/in.h>
          #include <sys/socket.h>
          #include <unistd.h>
          #include <cstdio>
          #include <cstring>

          namespace CTRPluginFramework
          {
              static const size_t SOC_ALIGN = 0x1000;
              static const size_t SOC_BUFFER_SIZE = 0x100000;
              static const u16 HTTP_PORT = 8080;

              static volatile bool gStop = false;
              static volatile int gStage = 0;
              static volatile int gLastError = 0;
              static u32 *gSocBuffer = nullptr;
              static int gServer = -1;
              static Thread gThread = nullptr;

              static void WriteStatus(const char *label)
              {
                  FILE *f = std::fopen("sdmc:/3DS-Cast-status.txt", "w");
                  if (!f) return;

                  std::fprintf(
                      f,
                      "3DS Cast v0.3.4\\n"
                      "stage=%d\\n"
                      "error=%d\\n"
                      "label=%s\\n",
                      (int)gStage,
                      (int)gLastError,
                      label ? label : "unknown");

                  std::fclose(f);
              }

              static const char kPage[] =
                  "<!doctype html><html><head><meta charset='utf-8'>"
                  "<meta name='viewport' content='width=device-width,initial-scale=1'>"
                  "<title>3DS Cast</title></head><body style='font-family:-apple-system;background:#111;color:white;padding:24px'>"
                  "<h1>3DS Cast v0.3.4</h1><p>Background HTTP server is running.</p>"
                  "<p>NSMB2 + CTRPF lifecycle + worker thread test: OK.</p></body></html>";

              static bool SendAll(int sock, const char *data, size_t len)
              {
                  while (len)
                  {
                      int sent = send(sock, data, len, 0);
                      if (sent <= 0) return false;
                      data += sent;
                      len -= (size_t)sent;
                  }
                  return true;
              }

              static void Reply(int client, const char *type, const char *body, size_t len)
              {
                  char header[256];
                  int n = std::snprintf(header, sizeof(header),
                      "HTTP/1.1 200 OK\r\nContent-Type: %s\r\nContent-Length: %lu\r\nConnection: close\r\nCache-Control: no-store\r\n\r\n",
                      type, (unsigned long)len);
                  if (n > 0)
                  {
                      SendAll(client, header, (size_t)n);
                      SendAll(client, body, len);
                  }
              }

              static void HandleClient(int client)
              {
                  char req[512];
                  std::memset(req, 0, sizeof(req));
                  int got = recv(client, req, sizeof(req) - 1, 0);
                  if (got <= 0) return;

                  if (std::strncmp(req, "GET /status ", 12) == 0)
                  {
                      char json[160];
                      int n = std::snprintf(json, sizeof(json),
                          "{\"ok\":true,\"version\":\"0.3.4\",\"stage\":%d,\"error\":%d}",
                          (int)gStage, (int)gLastError);
                      if (n > 0) Reply(client, "application/json; charset=utf-8", json, (size_t)n);
                      return;
                  }

                  Reply(client, "text/html; charset=utf-8", kPage, sizeof(kPage) - 1);
              }

              static void ServerWorker(void *)
              {
                  gStage = 1;
                  gLastError = 0;
                  WriteStatus("worker-started");

                  gSocBuffer = (u32 *)memalign(SOC_ALIGN, SOC_BUFFER_SIZE);
                  if (!gSocBuffer)
                  {
                      gLastError = -1001;
                      gStage = -1;
                      WriteStatus("memalign-failed");
                      return;
                  }

                  gStage = 2;
                  WriteStatus("before-socInit");
                  Result rc = socInit(gSocBuffer, SOC_BUFFER_SIZE);
                  if (R_FAILED(rc))
                  {
                      gLastError = (int)rc;
                      free(gSocBuffer);
                      gSocBuffer = nullptr;
                      gStage = -2;
                      WriteStatus("socInit-failed");
                      return;
                  }

                  gStage = 3;
                  WriteStatus("socInit-ok");
                  gServer = socket(AF_INET, SOCK_STREAM, IPPROTO_IP);
                  if (gServer < 0)
                  {
                      gLastError = errno;
                      socExit();
                      free(gSocBuffer);
                      gSocBuffer = nullptr;
                      gStage = -3;
                      WriteStatus("socket-failed");
                      return;
                  }

                  int yes = 1;
                  setsockopt(gServer, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof(yes));

                  sockaddr_in addr;
                  std::memset(&addr, 0, sizeof(addr));
                  addr.sin_family = AF_INET;
                  addr.sin_port = htons(HTTP_PORT);
                  addr.sin_addr.s_addr = htonl(INADDR_ANY);

                  gStage = 4;
                  WriteStatus("socket-ok-before-bind");
                  if (bind(gServer, (sockaddr *)&addr, sizeof(addr)) < 0)
                  {
                      gLastError = errno;
                      close(gServer);
                      gServer = -1;
                      socExit();
                      free(gSocBuffer);
                      gSocBuffer = nullptr;
                      gStage = -4;
                      WriteStatus("bind-failed");
                      return;
                  }

                  gStage = 5;
                  WriteStatus("bind-ok-before-listen");
                  if (listen(gServer, 2) < 0)
                  {
                      gLastError = errno;
                      close(gServer);
                      gServer = -1;
                      socExit();
                      free(gSocBuffer);
                      gSocBuffer = nullptr;
                      gStage = -5;
                      WriteStatus("listen-failed");
                      return;
                  }

                  int flags = fcntl(gServer, F_GETFL, 0);
                  fcntl(gServer, F_SETFL, flags | O_NONBLOCK);
                  gStage = 6;
                  WriteStatus("server-ready");

                  while (!gStop)
                  {
                      sockaddr_in clientAddr;
                      socklen_t clientLen = sizeof(clientAddr);
                      int client = accept(gServer, (sockaddr *)&clientAddr, &clientLen);
                      if (client >= 0)
                      {
                          HandleClient(client);
                          close(client);
                      }
                      svcSleepThread(10 * 1000 * 1000LL);
                  }

                  if (gServer >= 0) { close(gServer); gServer = -1; }
                  socExit();
                  if (gSocBuffer) { free(gSocBuffer); gSocBuffer = nullptr; }
                  gStage = 0;
              }

              void PatchProcess(FwkSettings &settings) { (void)settings; }

              void OnProcessExit(void)
              {
                  gStop = true;
                  if (gThread)
                  {
                      if (R_SUCCEEDED(threadJoin(gThread, 2ULL * 1000ULL * 1000ULL * 1000ULL)))
                          threadFree(gThread);
                      gThread = nullptr;
                  }
              }

              int main(void)
              {
                  gStop = false;
                  gStage = 0;
                  gLastError = 0;

                  gThread = threadCreate(ServerWorker, nullptr, 0x10000, 0x30, -2, false);

                  PluginMenu *menu = new PluginMenu(
                      "3DS Cast", 0, 3, 3,
                      "Background HTTP diagnostic.\nDo not press Select during this test.");

                  menu->SynchronizeWithFrame(true);
                  menu->Run();

                  gStop = true;
                  if (gThread)
                  {
                      if (R_SUCCEEDED(threadJoin(gThread, 2ULL * 1000ULL * 1000ULL * 1000ULL)))
                          threadFree(gThread);
                      gThread = nullptr;
                  }

                  delete menu;
                  return 0;
              }
          }
          EOF

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/3dscast
          make clean || true
          make -j1
          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/default.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"
          cat > "$GITHUB_WORKSPACE/release/README.txt" <<'EOF'
          3DS Cast v0.3.4 Threaded HTTP

          1. Note the 3DS IP in FTPD.
          2. Put default.3gx in SD:/luma/plugins/default.3gx
          3. Launch New Super Mario Bros. 2.
          4. DO NOT PRESS SELECT.
          5. Wait for Plugin Ready and 20 seconds.
          6. Open http://YOUR_3DS_IP:8080/
          7. Also test http://YOUR_3DS_IP:8080/status

          Expected /status when fully ready:
          {"ok":true,"version":"0.3.3","stage":6,"error":0}
          EOF

      - name: Upload 3DS Cast v0.3.4
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.3.4-Network-Diagnostic
          path: release/
          if-no-files-found: error
          retention-days: 30
