name: 3DS Cast v0.3.1 Headless HTTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git cmake g++ ca-certificates

      - name: Build CTRPluginFramework 0.8.0
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ctrpf-src /tmp/ctrpf-dist
          git clone --recursive --depth 1 --branch 0.8.0 https://gitlab.com/thepixellizeross/ctrpluginframework.git /tmp/ctrpf-src
          cd /tmp/ctrpf-src/Library
          PATCHED=0
          for f in $(find . -maxdepth 2 -type f \( -name 'Makefile' -o -name '*.mk' \) -print); do
            if grep -q -- '-Werror' "$f"; then
              sed -i 's/-Werror/-Werror -Wno-error=unused-but-set-variable/g' "$f"
              PATCHED=1
            fi
          done
          test "$PATCHED" -eq 1
          make clean || true
          make -j1
          make dist-bin
          ARCHIVE="$(find . -maxdepth 2 -type f \( -name '*.tar.bz2' -o -name '*.tar.gz' -o -name '*.tar' \) -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p /tmp/ctrpf-dist
          tar -xf "$ARCHIVE" -C /tmp/ctrpf-dist
          ROOT="$(find /tmp/ctrpf-dist -type d -name include -printf '%h\n' | while read -r d; do if [ -d "$d/lib" ]; then echo "$d"; break; fi; done)"
          test -n "$ROOT"
          rm -rf /opt/devkitpro/libctrpf
          mkdir -p /opt/devkitpro/libctrpf
          cp -a "$ROOT/include" "$ROOT/lib" /opt/devkitpro/libctrpf/

      - name: Build 3gxtool 1.3
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/3gxtool
          git clone --recursive --depth 1 --branch v1.3 https://gitlab.com/thepixellizeross/3gxtool.git /tmp/3gxtool
          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build
          cmake --build /tmp/3gxtool/build -j2
          test -x /tmp/3gxtool/build/3gxtool
          install -m 0755 /tmp/3gxtool/build/3gxtool /usr/local/bin/3gxtool

      - name: Prepare 3DS Cast v0.3.1
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/3dscast
          git clone --depth 1 --branch v0.8.0 https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git /tmp/3dscast
          rm -rf /tmp/3dscast/.git /tmp/3dscast/.github

          cat > /tmp/3dscast/CTRPluginFramework.plgInfo <<'EOF'
          Author: 3DS Cast

          Version:
              Major: 0
              Minor: 3
              Revision: 1

          Targets:

          Title: 3DS Cast Headless

          Summary: Automatic local HTTP server

          Description: |
            Headless networking test.
            No CTRPF menu is opened.
            The HTTP server starts automatically on port 8080.

          Compatibility: Any

          MemorySize: 5MiB

          UsePrivateMemory: true
          EOF

          cat > /tmp/3dscast/Sources/main.cpp <<'EOF'
          #include <3ds.h>
          #include <CTRPluginFramework.hpp>
          #include <arpa/inet.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <malloc.h>
          #include <netinet/in.h>
          #include <sys/socket.h>
          #include <unistd.h>
          #include <cstdio>
          #include <cstring>

          namespace CTRPluginFramework
          {
              static constexpr size_t SOC_ALIGN = 0x1000;
              static constexpr size_t SOC_BUFFER_SIZE = 0x100000;
              static constexpr u16 HTTP_PORT = 8080;

              static u32 *gSocBuffer = nullptr;
              static int gServer = -1;

              static const char kPage[] =
                  "<!doctype html><html><head><meta charset='utf-8'>"
                  "<meta name='viewport' content='width=device-width,initial-scale=1'>"
                  "<title>3DS Cast</title><style>"
                  "body{margin:0;background:#0b0c10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}"
                  ".card{width:min(88vw,520px);background:#17191f;border:1px solid #2a2d36;border-radius:22px;padding:24px}"
                  ".ok{display:inline-block;background:#173d2a;color:#84f0ad;padding:8px 12px;border-radius:999px;font-weight:700}"
                  "h1{margin:14px 0 8px}p{color:#b9becb;line-height:1.45}"
                  ".screen{margin-top:18px;aspect-ratio:5/3;background:#050608;border:1px solid #2e323d;border-radius:14px;display:grid;place-items:center;color:#747b8c}"
                  "</style></head><body><main class='card'><span class='ok'>3DS connected</span>"
                  "<h1>3DS Cast v0.3.1</h1><p>The HTTP server is running directly inside the game.</p>"
                  "<div class='screen'>Top-screen streaming is the next step.</div></main></body></html>";

              static bool SendAll(int sock, const char *data, size_t len)
              {
                  while (len)
                  {
                      int sent = send(sock, data, len, 0);
                      if (sent <= 0) return false;
                      data += sent;
                      len -= (size_t)sent;
                  }
                  return true;
              }

              static void Reply(int client, const char *status, const char *type, const char *body, size_t bodyLen)
              {
                  char header[256];
                  int n = std::snprintf(
                      header,
                      sizeof(header),
                      "HTTP/1.1 %s\r\n"
                      "Content-Type: %s\r\n"
                      "Content-Length: %lu\r\n"
                      "Connection: close\r\n"
                      "Cache-Control: no-store\r\n\r\n",
                      status,
                      type,
                      (unsigned long)bodyLen);

                  if (n > 0)
                  {
                      SendAll(client, header, (size_t)n);
                      SendAll(client, body, bodyLen);
                  }
              }

              static void HandleClient(int client)
              {
                  char req[768];
                  std::memset(req, 0, sizeof(req));

                  int got = recv(client, req, sizeof(req) - 1, 0);
                  if (got <= 0) return;

                  if (std::strncmp(req, "GET /ping ", 10) == 0)
                  {
                      static const char pong[] =
                          "{\"ok\":true,\"service\":\"3DS Cast\",\"version\":\"0.3.1\"}";
                      Reply(client, "200 OK", "application/json; charset=utf-8", pong, sizeof(pong) - 1);
                      return;
                  }

                  if (std::strncmp(req, "GET / ", 6) == 0)
                  {
                      Reply(client, "200 OK", "text/html; charset=utf-8", kPage, sizeof(kPage) - 1);
                      return;
                  }

                  static const char nope[] = "3DS Cast: not found";
                  Reply(client, "404 Not Found", "text/plain; charset=utf-8", nope, sizeof(nope) - 1);
              }

              static void Cleanup()
              {
                  if (gServer >= 0)
                  {
                      close(gServer);
                      gServer = -1;
                  }

                  if (gSocBuffer)
                  {
                      socExit();
                      free(gSocBuffer);
                      gSocBuffer = nullptr;
                  }
              }

              void PatchProcess(FwkSettings &settings)
              {
                  (void)settings;
              }

              void OnProcessExit(void)
              {
                  Cleanup();
              }

              int main(void)
              {
                  // No PluginMenu::Run(), no MessageBox, and no custom worker thread.
                  gSocBuffer = (u32*)memalign(SOC_ALIGN, SOC_BUFFER_SIZE);
                  if (!gSocBuffer)
                      return 10;

                  Result rc = socInit(gSocBuffer, SOC_BUFFER_SIZE);
                  if (R_FAILED(rc))
                  {
                      free(gSocBuffer);
                      gSocBuffer = nullptr;
                      return 11;
                  }

                  gServer = socket(AF_INET, SOCK_STREAM, IPPROTO_IP);
                  if (gServer < 0)
                  {
                      Cleanup();
                      return 12;
                  }

                  int yes = 1;
                  setsockopt(gServer, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof(yes));

                  sockaddr_in addr;
                  std::memset(&addr, 0, sizeof(addr));
                  addr.sin_family = AF_INET;
                  addr.sin_port = htons(HTTP_PORT);
                  addr.sin_addr.s_addr = htonl(INADDR_ANY);

                  if (bind(gServer, (sockaddr*)&addr, sizeof(addr)) < 0)
                  {
                      Cleanup();
                      return 13;
                  }

                  if (listen(gServer, 2) < 0)
                  {
                      Cleanup();
                      return 14;
                  }

                  int flags = fcntl(gServer, F_GETFL, 0);
                  fcntl(gServer, F_SETFL, flags | O_NONBLOCK);

                  for (;;)
                  {
                      sockaddr_in clientAddr;
                      socklen_t clientLen = sizeof(clientAddr);

                      int client = accept(
                          gServer,
                          (sockaddr*)&clientAddr,
                          &clientLen);

                      if (client >= 0)
                      {
                          // Kept deliberately simple for compatibility with libctru.
                          HandleClient(client);
                          close(client);
                      }

                      svcSleepThread(10 * 1000 * 1000LL);
                  }
              }
          }
          EOF

      - name: Build plugin
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/3dscast
          make clean || true
          make -j1
          PLUGIN="$(find . -maxdepth 2 -type f -name '*.3gx' -print -quit)"
          test -n "$PLUGIN"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$PLUGIN" "$GITHUB_WORKSPACE/release/default.3gx"
          cp CTRPluginFramework.plgInfo "$GITHUB_WORKSPACE/release/CTRPluginFramework.plgInfo"

          cat > "$GITHUB_WORKSPACE/release/README.txt" <<'EOF'
          3DS Cast v0.3.1 Headless HTTP

          Test with New Super Mario Bros. 2:
          1. Open FTPD and note the 3DS IP address.
          2. Replace SD:/luma/plugins/default.3gx with this default.3gx.
          3. Make sure Plugin Loader is enabled.
          4. Close FTPD and launch New Super Mario Bros. 2.
          5. DO NOT PRESS SELECT.
          6. Wait 20-30 seconds.
          7. On the iPhone, on the same network, open:
             http://YOUR_3DS_IP:8080/
          8. Optional:
             http://YOUR_3DS_IP:8080/ping

          Expected:
          Safari shows the 3DS Cast v0.3.1 page while NSMB2 stays running.
          EOF

      - name: Upload 3DS Cast v0.3.1
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Cast-v0.3.1-Headless
          path: release/
          if-no-files-found: error
          retention-days: 30
